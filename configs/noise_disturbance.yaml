scenario:
  name: noise_disturbance
  disturbance:
    type: piecewise_plus_noise
    noise_std: [0.05, 0.02]
    noise_sample_time: 0.05
    segments:
      - [0.0, 5.0, [0.0, 0.0]]
      - [5.0, 15.0, [0.3, 0.1]]
      - [15.0, 30.0, [-0.2, -0.1]]
  payload:
    enabled: false
  friction:
    enabled: true
    change_time: 10.0
    delta_d_v: 1.0
    delta_d_omega: 0.4
